name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build (typecheck + bundle)
        run: npm run build
      - name: Test (102 tests, including dist security guards)
        run: npm test

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t smartvcard:ci .
      - name: Run container and check endpoints
        run: |
          set -euo pipefail
          docker run -d --name smartvcard-ci -p 8088:80 smartvcard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          echo "healthz: $(curl -fsS http://127.0.0.1:8088/healthz)"
          echo "index:   $(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/)"
          echo "sw.js:   $(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/sw.js)"
          echo "404-ish: $(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/unknown/path)"
      - name: Container logs
        if: always()
        run: docker logs smartvcard-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f smartvcard-ci || true
