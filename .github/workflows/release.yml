name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          (cd dist && zip -qr "../release/SmartVCard-${VERSION}-Windows-x64.zip" .)
          tar -czf "release/SmartVCard-${VERSION}-Linux-x64.tar.gz" -C dist .
          git archive --format=zip --prefix="SmartVCard-${VERSION}/" \
            -o "release/SmartVCard-${VERSION}-source.zip" HEAD
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/*
          retention-days: 1

  image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${TAG#v}"
          # Single-platform, single-manifest image: no provenance/SBOM
          # attestations, so the cleanup job can never delete a child manifest
          # that the tagged index still references.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t "$IMAGE:${VERSION}" \
            -t "$IMAGE:latest" \
            --push \
            .

  release:
    name: Publish GitHub Release
    needs: [verify, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(release/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --generate-notes
          fi

  cleanup:
    name: Clean up superseded packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Release assets (keep the Release records)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [ -z "${TAG:-}" ]; then echo "TAG is empty"; exit 1; fi
          mapfile -t rows < <(gh api "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name != \"$TAG\") | .assets[] | \"\(.id)\t\(.name)\"")
          for row in "${rows[@]}"; do
            [ -z "$row" ] && continue
            id="${row%%$'\t'*}"
            name="${row#*$'\t'}"
            echo "Deleting asset $name ($id)"
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/assets/$id" || true
          done
          echo "Old Release assets removed (Release records kept)."
      - name: Keep only latest and the current version in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          PKG=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          VERSION="${TAG#v}"
          API="/users/$OWNER/packages/container/$PKG/versions"
          if ! gh api "$API" >/dev/null 2>&1; then
            echo "Package not readable by this token; skipping GHCR cleanup."
            exit 0
          fi
          mapfile -t rows < <(gh api "$API" --paginate \
            --jq '.[] | "\(.id)\t\((.metadata.container.tags // []) | join(","))"')
          for row in "${rows[@]}"; do
            [ -z "$row" ] && continue
            id="${row%%$'\t'*}"
            tags="${row#*$'\t'}"
            keep=false
            IFS=',' read -ra list <<< "$tags"
            for tag in "${list[@]}"; do
              if [ "$tag" = "latest" ] || [ "$tag" = "$VERSION" ]; then
                keep=true
              fi
            done
            if [ "$keep" = false ]; then
              echo "Deleting package version $id (tags: ${tags:-untagged})"
              gh api -X DELETE "/users/$OWNER/packages/container/$PKG/versions/$id" || true
            fi
          done
      - name: Keep only the current run's Actions artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mapfile -t rows < <(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | "\(.id)\t\(.workflow_run.id)"')
          for row in "${rows[@]}"; do
            [ -z "$row" ] && continue
            id="${row%%$'\t'*}"
            run="${row#*$'\t'}"
            if [ "$run" != "$GITHUB_RUN_ID" ]; then
              echo "Deleting artifact $id from run $run"
              gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            fi
          done
