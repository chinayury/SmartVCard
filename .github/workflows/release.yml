name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create release packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          (cd dist && zip -qr "../release/SmartVCard-${VERSION}-Windows-x64.zip" .)
          tar -czf "release/SmartVCard-${VERSION}-Linux-x64.tar.gz" -C dist .
          git archive --format=zip --prefix="SmartVCard-${VERSION}/" \
            -o "release/SmartVCard-${VERSION}-source.zip" HEAD
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/*
          retention-days: 1

  image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${TAG#v}"
          docker build -t "$IMAGE:${VERSION}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${VERSION}"
          docker push "$IMAGE:latest"

  release:
    name: Publish GitHub Release
    needs: [verify, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release
      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(release/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --generate-notes
          fi

  cleanup:
    name: Clean up superseded packages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Release assets (keep the Release records)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r other; do
            [ -z "$other" ] && continue
            [ "$other" = "$TAG" ] && continue
            gh release view "$other" --json assets -q '.assets[].name' | while read -r asset; do
              [ -z "$asset" ] && continue
              echo "Deleting asset $asset from $other"
              gh release delete-asset "$other" "$asset" --yes
            done
          done
      - name: Keep only latest and the current version in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          PKG=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          VERSION="${TAG#v}"
          API="/users/$OWNER/packages/container/$PKG/versions"
          if ! gh api "$API" >/dev/null 2>&1; then
            echo "Package not readable by this token; skipping GHCR cleanup."
            exit 0
          fi
          gh api "$API" --paginate \
            -q '.[] | [.id, ((.metadata.container.tags // []) | join(","))] | @tsv' |
          while IFS=$'\t' read -r id tags; do
            keep=false
            IFS=',' read -ra list <<< "$tags"
            for tag in "${list[@]}"; do
              if [ "$tag" = "latest" ] || [ "$tag" = "$VERSION" ]; then
                keep=true
              fi
            done
            if [ "$keep" = false ]; then
              echo "Deleting package version $id (tags: ${tags:-untagged})"
              gh api -X DELETE "/users/$OWNER/packages/container/$PKG/versions/$id" || true
            fi
          done
      - name: Keep only the current run's Actions artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate \
            -q '.artifacts[] | [.id, (.workflow_run.id | tostring)] | @tsv' |
          while IFS=$'\t' read -r id run; do
            if [ "$run" != "$GITHUB_RUN_ID" ]; then
              echo "Deleting artifact $id from run $run"
              gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || true
            fi
          done
