server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The app is a self-contained static bundle. These headers complement the
    # CSP meta tag that vite.config.ts injects into dist/index.html.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Lightweight liveness endpoint used by Docker and CI smoke tests.
    location = /healthz {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    # Never cache the entry document or the service worker: new deploys must be
    # picked up on the next visit.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires -1;
    }

    # Hashed asset filenames are immutable by construction.
    location /assets/ {
        expires 1y;
    }

    location /icons/ {
        expires 7d;
    }

    # HashRouter keeps all routes inside the fragment, so no SPA rewrite is
    # strictly required; the fallback only covers direct deep links to files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
