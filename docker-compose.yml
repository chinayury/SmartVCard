services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartvcard:latest
    container_name: smartvcard
    restart: unless-stopped
    ports:
      - "${SMARTVCARD_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
